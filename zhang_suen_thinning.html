<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zhang-Suen Image Thinning (Continuous Tracing)</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .container { background: rgba(255, 255, 255, 0.95); border-radius: 20px; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); backdrop-filter: blur(10px); }
        h1 { text-align: center; color: #333; margin-bottom: 30px; font-size: 2.5rem; background: linear-gradient(45deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .upload-section { text-align: center; margin-bottom: 30px; }
        .file-input-wrapper { position: relative; display: inline-block; overflow: hidden; background: linear-gradient(45deg, #667eea, #764ba2); color: white; padding: 12px 30px; border-radius: 50px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .file-input-wrapper:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        .file-input { position: absolute; left: -9999px; }
        .controls { text-align: center; margin-bottom: 30px; }
        .btn { background: linear-gradient(45deg, #4CAF50, #45a049); color: white; padding: 12px 30px; border: none; border-radius: 50px; cursor: pointer; font-size: 16px; margin: 0 10px; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .image-container { display: flex; flex-direction: column; gap: 30px; align-items: center; }
        .image-window { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; width: calc(100% - 40px); max-width: none; transition: all 0.3s ease; }
        .image-window:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0,0,0,0.15); }
        .image-window h3 { margin-top: 0; color: #333; font-size: 1.2rem; }
        canvas { border: 2px solid #ddd; border-radius: 10px; max-width: 100%; width: 100%; height: auto; background: #f9f9f9; }
        .info { background: rgba(103, 126, 234, 0.1); border-left: 4px solid #667eea; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        .threshold-control { margin: 10px 0; }
        .threshold-control label { display: inline-block; margin-right: 10px; font-weight: bold; }
        .threshold-control input[type="range"] { width: 200px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Zhang-Suen Image Thinning</h1>
        <div class="info">
            <p><strong>Zhang-Suen thinning</strong> reduces binary images to their skeletal form while preserving topology. Upload a line drawing or sketch to see the algorithm in action!</p>
        </div>
        <div class="upload-section">
            <div class="file-input-wrapper">
                <input type="file" id="imageInput" class="file-input" accept="image/*" />
                Choose Image File
            </div>
        </div>
        <div class="controls">
            <div class="threshold-control">
                <label for="threshold">Binary Threshold:</label>
                <input type="range" id="threshold" min="0" max="255" value="128" />
                <span id="thresholdValue">128</span>
            </div>
            <div class="threshold-control">
                <label>
                    <input type="checkbox" id="simplifyPath" checked />
                    Apply Douglas-Peucker Simplification
                </label>
            </div>
            <div class="threshold-control">
                <label>
                    <input type="checkbox" id="optimizePath" checked />
                    Optimize Drawing Order
                </label>
            </div>
            <br />
            <button id="processBtn" class="btn" disabled>Apply Zhang-Suen Thinning</button>
            <button id="resetBtn" class="btn">Reset</button>
        </div>
        <div class="image-container">
            <div class="image-window">
                <h3>Original Image</h3>
                <canvas id="originalCanvas" width="400" height="300"></canvas>
            </div>
            <div class="image-window">
                <h3>Thinned Result</h3>
                <canvas id="resultCanvas" width="400" height="300"></canvas>
            </div>
            <div class="image-window">
                <h3>Vectorized Curves</h3>
                <canvas id="vectorCanvas" width="400" height="300"></canvas>
            </div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const processBtn = document.getElementById('processBtn');
        const resetBtn = document.getElementById('resetBtn');
        const originalCanvas = document.getElementById('originalCanvas');
        const resultCanvas = document.getElementById('resultCanvas');
        const vectorCanvas = document.getElementById('vectorCanvas');
        const thresholdSlider = document.getElementById('threshold');
        const thresholdValue = document.getElementById('thresholdValue');
        const simplifyCheckbox = document.getElementById('simplifyPath');
        const optimizeCheckbox = document.getElementById('optimizePath');

        const originalCtx = originalCanvas.getContext('2d');
        const resultCtx = resultCanvas.getContext('2d');
        const vectorCtx = vectorCanvas.getContext('2d');

        let currentImage = null;

        thresholdSlider.addEventListener('input', (e) => {
            thresholdValue.textContent = e.target.value;
        });

        imageInput.addEventListener('change', handleImageUpload);
        document.querySelector('.file-input-wrapper').addEventListener('click', () => imageInput.click());
        processBtn.addEventListener('click', applyZhangSuenThinning);
        resetBtn.addEventListener('click', reset);

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    currentImage = img;
                    displayOriginalImage(img);
                    processBtn.disabled = false;
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function displayOriginalImage(img) {
            const containerWidth = Math.min(window.innerWidth - 120, img.width);
            const aspectRatio = img.height / img.width;
            const canvasWidth = containerWidth;
            const canvasHeight = containerWidth * aspectRatio;
            originalCanvas.width = canvasWidth;
            originalCanvas.height = canvasHeight;
            originalCtx.drawImage(img, 0, 0, canvasWidth, canvasHeight);
        }

        function applyZhangSuenThinning() {
            if (!currentImage) return;
            processBtn.textContent = 'Processing...';
            processBtn.disabled = true;
            setTimeout(() => {
                const threshold = parseInt(thresholdSlider.value);
                const imageData = originalCtx.getImageData(0, 0, originalCanvas.width, originalCanvas.height);
                const binaryData = toBinary(imageData, threshold);
                const thinnedData = zhangSuenThinning(binaryData, originalCanvas.width, originalCanvas.height);
                displayResult(thinnedData, originalCanvas.width, originalCanvas.height);
                const shouldSimplify = simplifyCheckbox.checked;
                const shouldOptimize = optimizeCheckbox.checked;
                const curves = vectorizeSkeleton(thinnedData, originalCanvas.width, originalCanvas.height, shouldSimplify, shouldOptimize);
                displayVectorizedCurves(curves, originalCanvas.width, originalCanvas.height, shouldOptimize);
                processBtn.textContent = 'Apply Zhang-Suen Thinning';
                processBtn.disabled = false;
            }, 50);
        }

        function toBinary(imageData, threshold) {
            const data = imageData.data;
            const binary = new Array(data.length / 4);
            for (let i = 0; i < data.length; i += 4) {
                const gray = (data[i] + data[i + 1] + data[i + 2]) / 3;
                binary[i / 4] = gray < threshold ? 1 : 0; // 1 for black (foreground)
            }
            return binary;
        }

        function zhangSuenThinning(binary, width, height) {
            let current = [...binary];
            let changed = true;
            while (changed) {
                changed = false;
                const toDelete1 = [];
                for (let y = 1; y < height - 1; y++) {
                    for (let x = 1; x < width - 1; x++) {
                        const idx = y * width + x;
                        if (current[idx] === 1 && shouldDelete1(current, x, y, width)) toDelete1.push(idx);
                    }
                }
                for (const idx of toDelete1) { current[idx] = 0; changed = true; }
                const toDelete2 = [];
                for (let y = 1; y < height - 1; y++) {
                    for (let x = 1; x < width - 1; x++) {
                        const idx = y * width + x;
                        if (current[idx] === 1 && shouldDelete2(current, x, y, width)) toDelete2.push(idx);
                    }
                }
                for (const idx of toDelete2) { current[idx] = 0; changed = true; }
            }
            return current;
        }

        function getNeighbors(data, x, y, width) {
            return [
                data[(y-1) * width + x],
                data[(y-1) * width + (x+1)],
                data[y * width + (x+1)],
                data[(y+1) * width + (x+1)],
                data[(y+1) * width + x],
                data[(y+1) * width + (x-1)],
                data[y * width + (x-1)],
                data[(y-1) * width + (x-1)],
            ];
        }
        function countTransitions(neighbors) {
            let count = 0; for (let i = 0; i < 8; i++) if (neighbors[i] === 0 && neighbors[(i + 1) % 8] === 1) count++; return count;
        }
        function countBlackNeighbors(neighbors) { return neighbors.reduce((s, v) => s + v, 0); }
        function shouldDelete1(data, x, y, width) {
            const n = getNeighbors(data, x, y, width); const [p1,p2,p3,p4,p5,p6,p7] = n; const bn = countBlackNeighbors(n); const t = countTransitions(n);
            return (bn >= 2 && bn <= 6 && t === 1 && (p1 * p3 * p5) === 0 && (p3 * p5 * p7) === 0);
        }
        function shouldDelete2(data, x, y, width) {
            const n = getNeighbors(data, x, y, width); const [p1,,p3,,p5,,p7] = n; const bn = countBlackNeighbors(n); const t = countTransitions(n);
            return (bn >= 2 && bn <= 6 && t === 1 && (p1 * p3 * p7) === 0 && (p1 * p5 * p7) === 0);
        }

        function displayResult(binaryData, width, height) {
            resultCanvas.width = width; resultCanvas.height = height;
            const imageData = resultCtx.createImageData(width, height); const data = imageData.data;
            for (let i = 0; i < binaryData.length; i++) { const value = binaryData[i] === 1 ? 0 : 255; data[i*4] = value; data[i*4+1] = value; data[i*4+2] = value; data[i*4+3] = 255; }
            resultCtx.putImageData(imageData, 0, 0);
        }

        function reset() {
            originalCtx.clearRect(0, 0, originalCanvas.width, originalCanvas.height);
            resultCtx.clearRect(0, 0, resultCanvas.width, resultCanvas.height);
            vectorCtx.clearRect(0, 0, vectorCanvas.width, vectorCanvas.height);
            imageInput.value = ''; currentImage = null; processBtn.disabled = true; processBtn.textContent = 'Apply Zhang-Suen Thinning';
        }

        // ===================== Vectorization =====================
        function vectorizeSkeleton(binaryData, width, height, shouldSimplify = true, shouldOptimize = true) {
            const paths = tracePaths(binaryData, width, height);
            let allCurves = [];
            for (const path of paths) {
                if (path.length < 2) continue;
                let processedPath = path;
                if (shouldSimplify && path.length > 3) processedPath = douglasPeucker(path, 1.5);
                const pathCurve = createSingleCurveFromPath(processedPath);
                if (pathCurve) allCurves.push(pathCurve);
            }
            if (shouldOptimize && allCurves.length > 1) {
                allCurves = optimizeDrawingOrder(allCurves);
                allCurves = mergeCloseCurves(allCurves, 3); // stitch consecutive polylines
            }
            return allCurves;
        }

        function createSingleCurveFromPath(points) { if (points.length < 2) return null; return { type: 'polyline', points, id: Math.random().toString(36).slice(2, 11) }; }

        // --------- Option A: Continuous path tracing with endpoints + gap-bridging ---------
        function tracePaths(binaryData, width, height) {
            const visited = new Array(width * height).fill(false);
            const paths = [];

            // Helper to count 8-neighbors (foreground)
            function neighborCount(x, y) {
                let c = 0; for (let dy=-1; dy<=1; dy++) for (let dx=-1; dx<=1; dx++) {
                    if (dx===0 && dy===0) continue; const nx=x+dx, ny=y+dy; if (nx<0||ny<0||nx>=width||ny>=height) continue; if (binaryData[ny*width+nx]===1) c++; }
                return c;
            }

            // Prefer endpoints first to trace full strokes
            const endpoints = [];
            for (let y=0; y<height; y++) {
                for (let x=0; x<width; x++) {
                    const idx = y*width + x; if (binaryData[idx]!==1) continue; if (neighborCount(x,y)===1) endpoints.push({x,y});
                }
            }

            function nextSeed() {
                // Unvisited endpoint
                for (const p of endpoints) { const idx=p.y*width+p.x; if (!visited[idx]) return p; }
                // Any unvisited foreground pixel
                for (let y=0; y<height; y++) for (let x=0; x<width; x++) { const idx=y*width+x; if (binaryData[idx]===1 && !visited[idx]) return {x,y}; }
                return null;
            }

            let seed;
            while ((seed = nextSeed())) {
                const path = traceSinglePathContinuous(binaryData, visited, seed.x, seed.y, width, height, 2);
                if (path.length > 1) paths.push(path);
            }

            return paths;
        }

        function traceSinglePathContinuous(binaryData, visited, startX, startY, width, height, bridgeTolerance = 2) {
            const path = [];
            let current = { x: startX, y: startY };
            let prevDir = null; // {dx, dy}

            function idx(x, y) { return y * width + x; }
            function inBounds(x, y) { return x >= 0 && y >= 0 && x < width && y < height; }
            function dist2(a, b) { const dx=a.x-b.x, dy=a.y-b.y; return dx*dx+dy*dy; }

            function unvisitedNeighbors(x, y) {
                const n = [];
                for (let dy=-1; dy<=1; dy++) for (let dx=-1; dx<=1; dx++) {
                    if (dx===0 && dy===0) continue; const nx=x+dx, ny=y+dy; if (!inBounds(nx,ny)) continue; const i=idx(nx,ny); if (binaryData[i]===1 && !visited[i]) n.push({x:nx,y:ny, dx, dy});
                }
                return n;
            }

            function angleScore(dir) {
                if (!prevDir) return 0; // no penalty for first step
                // prefer keeping direction: smaller angle -> smaller score
                const dp = prevDir.dx*dir.dx + prevDir.dy*dir.dy; // -2..2 range (since dx,dy in [-1,0,1])
                return -dp; // higher dot -> lower score
            }

            function findNearestUnvisitedWithin(rMax) {
                let best = null; let bestD2 = Infinity;
                for (let r=1; r<=rMax; r++) {
                    for (let dy=-r; dy<=r; dy++) {
                        for (let dx=-r; dx<=r; dx++) {
                            const nx=current.x+dx, ny=current.y+dy; if (!inBounds(nx,ny)) continue; const i=idx(nx,ny);
                            if (binaryData[i]===1 && !visited[i]) {
                                const d2 = dx*dx + dy*dy; if (d2 < bestD2) { bestD2 = d2; best = {x:nx,y:ny}; }
                            }
                        }
                    }
                    if (best) break; // found within this radius
                }
                return best;
            }

            function bresenham(x0, y0, x1, y1) {
                const points = [];
                let dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
                let dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
                let err = dx + dy;
                while (true) {
                    points.push({x:x0, y:y0});
                    if (x0 === x1 && y0 === y1) break;
                    const e2 = 2 * err;
                    if (e2 >= dy) { err += dy; x0 += sx; }
                    if (e2 <= dx) { err += dx; y0 += sy; }
                }
                return points;
            }

            while (true) {
                // add current if first time
                if (!visited[idx(current.x, current.y)]) {
                    visited[idx(current.x, current.y)] = true;
                    path.push({ x: current.x, y: current.y });
                }

                // 1) prefer unvisited immediate neighbors
                const neigh = unvisitedNeighbors(current.x, current.y);
                if (neigh.length > 0) {
                    // pick neighbor that best preserves direction, then nearest
                    neigh.sort((a, b) => angleScore(a) - angleScore(b) || (a.dx*a.dx + a.dy*a.dy) - (b.dx*b.dx + b.dy*b.dy));
                    const n = neigh[0];
                    prevDir = { dx: n.dx, dy: n.dy };
                    current = { x: n.x, y: n.y };
                    continue;
                }

                // 2) try to bridge small gaps up to bridgeTolerance
                const jump = findNearestUnvisitedWithin(bridgeTolerance);
                if (jump) {
                    const line = bresenham(current.x, current.y, jump.x, jump.y);
                    // Append intermediate points (do not mark them visited unless they are skeleton)
                    for (let k = 1; k < line.length; k++) {
                        const p = line[k];
                        if (path.length === 0 || (p.x !== path[path.length-1].x || p.y !== path[path.length-1].y)) {
                            path.push({ x: p.x, y: p.y });
                        }
                        const ind = idx(p.x, p.y);
                        if (binaryData[ind] === 1 && !visited[ind]) visited[ind] = true; // mark only skeleton pixels
                    }
                    prevDir = { dx: Math.sign(jump.x - current.x), dy: Math.sign(jump.y - current.y) };
                    current = { x: jump.x, y: jump.y };
                    continue;
                }

                // 3) no continuation found
                break;
            }

            return path;
        }

        function douglasPeucker(points, epsilon) {
            if (points.length <= 2) return points;
            let maxDist = 0; let index = 0;
            const start = points[0]; const end = points[points.length - 1];
            for (let i = 1; i < points.length - 1; i++) {
                const dist = pointToLineDistance(points[i], start, end);
                if (dist > maxDist) { maxDist = dist; index = i; }
            }
            if (maxDist > epsilon) {
                const left = douglasPeucker(points.slice(0, index + 1), epsilon);
                const right = douglasPeucker(points.slice(index), epsilon);
                return [...left.slice(0, -1), ...right];
            } else {
                return [start, end];
            }
        }

        function pointToLineDistance(point, a, b) {
            const A = point.x - a.x; const B = point.y - a.y; const C = b.x - a.x; const D = b.y - a.y;
            const dot = A*C + B*D; const lenSq = C*C + D*D; if (lenSq === 0) return Math.sqrt(A*A + B*B);
            const t = dot / lenSq; const xx = a.x + Math.max(0, Math.min(1, t)) * C; const yy = a.y + Math.max(0, Math.min(1, t)) * D;
            const dx = point.x - xx; const dy = point.y - yy; return Math.sqrt(dx*dx + dy*dy);
        }

        // Keep as helper (unused for polyline case)
        function pathToBezier(points) {
            if (points.length < 2) return [];
            if (points.length === 2) { return [{ type: 'line', start: points[0], end: points[1], id: Math.random().toString(36).slice(2, 11) }]; }
            if (points.length === 3) { return [{ type: 'quadratic', p0: points[0], p1: points[1], p2: points[2], id: Math.random().toString(36).slice(2, 11) }]; }
            return [{ type: 'polyline', points, id: Math.random().toString(36).slice(2, 11) }];
        }

        function interpolatePoint(p1, p2, t) { return { x: p1.x + (p2.x - p1.x) * t, y: p1.y + (p2.y - p1.y) * t }; }

        function optimizeDrawingOrder(curves) {
            if (curves.length <= 1) return curves;
            const optimized = []; const remaining = [...curves];
            let current = remaining.shift(); optimized.push(current);
            while (remaining.length > 0) {
                const currentEnd = getCurveEndPoint(current);
                let minDist = Infinity; let nextIndex = 0; let shouldReverse = false;
                for (let i = 0; i < remaining.length; i++) {
                    const c = remaining[i]; const s = getCurveStartPoint(c); const e = getCurveEndPoint(c);
                    const dS = distance(currentEnd, s); const dE = distance(currentEnd, e);
                    if (dS < minDist) { minDist = dS; nextIndex = i; shouldReverse = false; }
                    if (dE < minDist) { minDist = dE; nextIndex = i; shouldReverse = true; }
                }
                let next = remaining.splice(nextIndex, 1)[0]; if (shouldReverse) next = reverseCurve(next);
                optimized.push(next); current = next;
            }
            return optimized;
        }

        function mergeCloseCurves(curves, tolerance = 2) {
            if (curves.length === 0) return curves;
            const merged = []; let current = curves[0];
            for (let i = 1; i < curves.length; i++) {
                const prevEnd = getCurveEndPoint(current); const nextStart = getCurveStartPoint(curves[i]);
                if (distance(prevEnd, nextStart) <= tolerance && current.type === 'polyline' && curves[i].type === 'polyline') {
                    current.points = [...current.points, ...curves[i].points];
                } else { merged.push(current); current = curves[i]; }
            }
            merged.push(current); return merged;
        }

        function getCurveStartPoint(curve) { if (curve.type === 'line') return curve.start; if (curve.type === 'quadratic' || curve.type === 'cubic') return curve.p0; if (curve.type === 'polyline') return curve.points[0]; return {x:0,y:0}; }
        function getCurveEndPoint(curve) { if (curve.type === 'line') return curve.end; if (curve.type === 'quadratic') return curve.p2; if (curve.type === 'cubic') return curve.p3; if (curve.type === 'polyline') return curve.points[curve.points.length-1]; return {x:0,y:0}; }
        function distance(a, b) { const dx=a.x-b.x, dy=a.y-b.y; return Math.sqrt(dx*dx + dy*dy); }
        function reverseCurve(curve) {
            switch (curve.type) {
                case 'line': return { ...curve, start: curve.end, end: curve.start };
                case 'quadratic': return { ...curve, p0: curve.p2, p2: curve.p0 };
                case 'cubic': return { ...curve, p0: curve.p3, p1: curve.p2, p2: curve.p1, p3: curve.p0 };
                case 'polyline': return { ...curve, points: [...curve.points].reverse() };
                default: return curve;
            }
        }

        function displayVectorizedCurves(curves, width, height, showOptimization = false) {
            vectorCanvas.width = width; vectorCanvas.height = height;
            vectorCtx.fillStyle = 'white'; vectorCtx.fillRect(0, 0, width, height);
            vectorCtx.lineWidth = 2; vectorCtx.lineCap = 'round'; vectorCtx.lineJoin = 'round';

            for (let i = 0; i < curves.length; i++) {
                const curve = curves[i];
                if (showOptimization) { const hue = (i / Math.max(1, curves.length)) * 270; vectorCtx.strokeStyle = `hsl(${hue}, 70%, 50%)`; }
                else { vectorCtx.strokeStyle = '#2196F3'; }

                vectorCtx.beginPath();
                if (curve.type === 'line') {
                    vectorCtx.moveTo(curve.start.x, curve.start.y); vectorCtx.lineTo(curve.end.x, curve.end.y);
                } else if (curve.type === 'quadratic') {
                    vectorCtx.moveTo(curve.p0.x, curve.p0.y); vectorCtx.quadraticCurveTo(curve.p1.x, curve.p1.y, curve.p2.x, curve.p2.y);
                } else if (curve.type === 'cubic') {
                    vectorCtx.moveTo(curve.p0.x, curve.p0.y); vectorCtx.bezierCurveTo(curve.p1.x, curve.p1.y, curve.p2.x, curve.p2.y, curve.p3.x, curve.p3.y);
                } else if (curve.type === 'polyline') {
                    const pts = curve.points; if (pts.length > 1) { vectorCtx.moveTo(pts[0].x, pts[0].y); for (let k=1; k<pts.length; k++) vectorCtx.lineTo(pts[k].x, pts[k].y); }
                }
                vectorCtx.stroke();

                if (showOptimization) {
                    const s = getCurveStartPoint(curve); const e = getCurveEndPoint(curve);
                    vectorCtx.fillStyle = '#4CAF50'; vectorCtx.beginPath(); vectorCtx.arc(s.x, s.y, 3, 0, Math.PI*2); vectorCtx.fill();
                    vectorCtx.fillStyle = '#F44336'; vectorCtx.beginPath(); vectorCtx.arc(e.x, e.y, 3, 0, Math.PI*2); vectorCtx.fill();
                    vectorCtx.fillStyle = 'black'; vectorCtx.font = '12px Arial'; vectorCtx.textAlign = 'center'; vectorCtx.fillText(i+1, s.x, s.y - 8);
                }
            }
        }
