<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="https://hmauroy.github.io/8bitHenrik.png" />
    <meta name="author" content="Henrik Mauroy hmauroy@gmail.com" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Img2SVG</title>
    <link rel="stylesheet" href="image2svg_v2.css">
    <script src="potrace_bg8.js"></script>
    <script src="potrace.js"></script>
    <!-- potrace repo: https://github.com/kilobtye/potrace/blob/master/potrace.js-->
    <style>
        
    </style>
</head>
<body>
    <div class="container">
        <div class="panels-grid">
            <div class="panel" id="img-window">
                <img id="img-src" src="lillebror_newborn512.png" alt="No Image">
                <div><input type="file" id="fileInput" name="file" /></div>
                <!-- Overlay div with close button -->
                <div class="overlay" id="img-overlay">
                    <button class="close-button" onclick="closeOverlay()" aria-label="Close overlay">
                        ×
                    </button>
                    <canvas id="canvas"></canvas>
                    <p id="status" class="crt-font">OpenCV.js is loading...</p>
                    Drawing grey image
                    
                </div>
            </div>

            <div class="panel" id="svgWindow">
                <div id="svgOutput"></div> 
                SVG
            </div>

            <div class="panel control-group" id="img-processing">
                <h3>Image processing</h3>

                <div class="slider-container">
                    <div class="slider-label">
                        <span>Drawing max width (mm)</span>
                        <span id="rngDrawingWidth-value">50</span>
                    </div>
                    <input type="range" min="0" max="100" value="50" class="slider filterSlider" id="rngDrawingWidth">
                </div>

                <div class="slider-container">
                    <div class="slider-label">
                        <span>Blur factor</span>
                        <span id="rngBlur-value">3</span>
                    </div>
                    <input type="range" min="0" max="99" value="3" class="slider filterSlider" id="rngBlur">
                </div>

                <div class="slider-container">
                    <div class="slider-label">
                        <span>B&W threshold</span>
                        <span id="rngThresh-value">2</span>
                    </div>
                    <input type="range" min="0" max="99" value="2" class="slider filterSlider" id="rngThresh">
                </div>

                <div class="slider-container">
                    <div class="slider-label">
                        <span>Turd size</span>
                        <span id="rngTurdsize-value">8</span>
                    </div>
                    <input type="range" min="0" max="99" value="8" class="slider filterSlider" id="rngTurdsize">
                </div>

                <div class="checkbox-group">
                    <div class="checkbox-container">
                        <input type="checkbox" id="silhouette" class="checkbox">
                        <label for="silhouette" class="checkbox-label">Silhouette Mode</label>
                    </div>

                    <div class="checkbox-container">
                        <input type="checkbox" id="fill" class="checkbox">
                        <label for="fill" class="checkbox-label">Fill</label>
                    </div>
                </div>

                <button class="create-btn" onclick="createSvg()">Create SVG</button>
            </div>

            <div class="panel" id="invisible">
                <!-- I am invisible-->
            </div>

            

            <div class="panel" id="canvas-centerLine">
                <canvas id="drawCanvas"></canvas>     
                centerline               
            </div>

            <div class="panel" id="outputWindow">
                <canvas id="outputCanvas"></canvas>
                output
            </div>
            
        
            <div class="panel control-group" id="output-options">
                <h3>Output Options</h3>

                <div class="checkbox-group">
                    <div class="checkbox-container">
                        <input type="checkbox" id="scanlinesCheckbox" class="checkbox">
                        <label for="scanlinesCheckbox" class="checkbox-label">Scanlines</label>
                    </div>

                    <div class="checkbox-container">
                        <input type="checkbox" id="fillCheckbox" class="checkbox">
                        <label for="fillCheckbox" class="checkbox-label">Fill</label>
                    </div>

                    <div class="checkbox-container">
                        <input type="checkbox" id="centerlineCheckbox" class="checkbox" checked>
                        <label for="centerlineCheckbox" class="checkbox-label">Centerline</label>
                    </div>

                    <div class="checkbox-container">
                        <input type="checkbox" id="outlineCheckbox" class="checkbox">
                        <label for="outlineCheckbox" class="checkbox-label">Outline</label>
                    </div>

                    <div class="checkbox-container">
                        <input type="checkbox" id="startpointsCheckbox" class="checkbox">
                        <label for="startpointsCheckbox" class="checkbox-label">Mark start points</label>
                    </div>
                </div>

                <div class="slider-container">
                    <div class="slider-label">
                        <span>Center line separation</span>
                        <span id="slider4-value">30</span>
                    </div>
                    <input type="range" min="2" max="100" value="30" class="slider" id="slider4">
                </div>

                <div class="slider-container">
                    <div class="slider-label">
                        <span>Pupil diameter</span>
                        <span id="slider1-value">10</span>
                    </div>
                    <input type="range" min="1" max="100" value="10" class="slider" id="slider1">
                </div>

            </div>
            <div class="panel control-group" id="smoothing-controls">
                <h3>Smoothing Controls</h3>

                <div class="slider-container">
                    <div class="slider-label">
                        <span>Min distance</span>
                        <span id="slider2-value">75</span>
                    </div>
                    <input type="range" min="0" max="100" value="75" class="slider" id="slider2">
                </div>

                <div class="slider-container">
                    <div class="slider-label">
                        <span>Angle threshold</span>
                        <span id="slider3-value">25</span>
                    </div>
                    <input type="range" min="0" max="100" value="25" class="slider" id="slider3">
                </div>

                <div class="slider-container">
                    <div class="slider-label">
                        <span>Slider 5</span>
                        <span id="slider5-value">80</span>
                    </div>
                    <input type="range" min="0" max="100" value="80" class="slider" id="slider5">
                </div>

                <div class="slider-container">
                    <div class="slider-label">
                        <span>Slider 6</span>
                        <span id="slider6-value">80</span>
                    </div>
                    <input type="range" min="0" max="100" value="80" class="slider" id="slider6">
                </div>

            </div>
        </div>
        <div>
            <button class="create-btn" id="btnCopy">Copy SVG</button>
        </div>
        
        <textarea id="svgTextOutput" rows="5" cols="50"></textarea>
    </div>

    <script type="text/javascript" src="image_to_svg.js"></script>

    <script async src="opencv.js" type="text/javascript"></script>
    <!--script async src="https://docs.opencv.org/4.5.0/opencv.js" type="text/javascript"></script-->

    <script type="text/javascript">
        // Close overlay function
        function closeOverlay() {
            const overlay = document.getElementById('img-overlay');
            overlay.classList.add('hidden');
        }

        // Show overlay function (optional - for demonstration)
        function showOverlay() {
            const overlay = document.getElementById('img-overlay');
            overlay.classList.remove('hidden');
        }

        // Update slider values in real-time
        document.querySelectorAll('.slider').forEach(slider => {
            slider.addEventListener('input', function() {
                // Check if the slider is of type .filterSlider
                if (slider.classList.contains("filterSlider")) {
                    applyFilters();
                }
                const valueDisplay = document.getElementById(this.id + '-value');
                if (valueDisplay) {
                    valueDisplay.textContent = this.value;
                }
            });
        });

        // Process image function
        function processImage() {
            const button = document.querySelector('.create-btn');
            button.textContent = 'Processing...';
            button.disabled = true;
            
            // Simulate processing
            setTimeout(() => {
                button.textContent = 'Create';
                button.disabled = false;
                
                // Add a subtle success indication
                button.style.background = 'linear-gradient(45deg, #27ae60, #2ecc71)';
                setTimeout(() => {
                    button.style.background = 'linear-gradient(45deg, #667eea, #764ba2)';
                }, 1000);
            }, 2000);
        }

        function copySVG() {
            // Copies the textarea to clipboard.
        }

    </script>
</body>
</html>
