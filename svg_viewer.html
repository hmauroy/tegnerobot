<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bezier Curve Plotter</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
      }
      textarea {
        width: 80%;
        height: 100px;
      }
      canvas {
        border: 1px solid black;
        margin-top: 10px;
      }
      #legend {
        margin-top: 10px;
        text-align: left;
        display: inline-block;
      }
      .legend-item {
        display: flex;
        align-items: center;
        margin: 2px 0;
      }
      .legend-color {
        width: 20px;
        height: 20px;
        display: inline-block;
        margin-right: 5px;
      }
    </style>
  </head>
  <body>
    <h2>Bezier Curve Plotter</h2>
    <textarea
      id="inputData"
      placeholder="Enter SVG-like Bezier path data"
    ></textarea>
    <br />
    <button onclick="drawPaths()">Draw</button>
    <br />
    <canvas id="canvas" width="500" height="500"></canvas>
    <div id="legend"></div>

    <script>
      function generateColorPalette() {
        const colorPalette = [];
        const nColors = 15; // number of colors in the gradient

        // Typical temperature hue range: blue (240°) → red (0°)
        const startHue = 240; // cold (blue)
        const endHue = 0;     // hot (red)

        for (let i = 0; i < nColors; i++) {
          const ratio = i / (nColors - 1); // 0 → 1
          const hue = startHue + (endHue - startHue) * ratio;
          const saturation = 100;
          const lightness = 50;

          const color = `hsl(${hue}, ${saturation}%, ${lightness}%)`;
          colorPalette.push(color);
        }

        return colorPalette;
      }

      const colorPalette = generateColorPalette();
      let colorIndex = 0;

      function getRandomColor() {
        let color = colorPalette[colorIndex % colorPalette.length];
        colorIndex++;
        return color;
      }

      function normalizePaths(paths, width, height) {
        let minX = Infinity,
          minY = Infinity,
          maxX = -Infinity,
          maxY = -Infinity;

        paths.forEach((path) => {
          for (let i = 1; i < path.length; i++) {
            if (
              typeof path[i] === "number" &&
              typeof path[i + 1] === "number"
            ) {
              minX = Math.min(minX, path[i]);
              minY = Math.min(minY, path[i + 1]);
              maxX = Math.max(maxX, path[i]);
              maxY = Math.max(maxY, path[i + 1]);
            }
          }
        });

        const scaleX = width / (maxX - minX);
        const scaleY = height / (maxY - minY);
        const scale = Math.min(scaleX, scaleY);

        return paths.map((path) => {
          let newPath = [];
          for (let i = 0; i < path.length; i++) {
            if (typeof path[i] === "string") {
              newPath.push(path[i]);
            } else {
              newPath.push((path[i] - minX) * scale);
            }
          }
          return newPath;
        });
      }

      function drawPaths() {
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const legend = document.getElementById("legend");
        legend.innerHTML = "";

        const input = document.getElementById("inputData").value;
        let paths;
        try {
          paths = JSON.parse(input);
        } catch (e) {
          alert("Invalid JSON input");
          return;
        }

        paths = normalizePaths(paths, canvas.width, canvas.height);

        paths.forEach((path, index) => {
          let color = getRandomColor();
          ctx.strokeStyle = color;
          //ctx.strokeStyle = "black";
          ctx.beginPath();
          for (let i = 0; i < path.length; i++) {
            const cmd = path[i];
            if (cmd === "M") {
              ctx.moveTo(path[i + 1], path[i + 2]);
              i += 2;
            } else if (cmd === "C") {
              ctx.bezierCurveTo(
                path[i + 1],
                path[i + 2],
                path[i + 3],
                path[i + 4],
                path[i + 5],
                path[i + 6]
              );
              i += 6;
            } else if (cmd === "L") {
              ctx.lineTo(path[i + 1], path[i + 2]);
              i += 2;
            }
          }
          ctx.stroke();

          // Add legend item
          let legendItem = document.createElement("div");
          legendItem.classList.add("legend-item");
          legendItem.innerHTML = `<div class='legend-color' style='background:${color};'></div> Path ${
            index + 1
          }`;
          legend.appendChild(legendItem);
        });
      }
    </script>
  </body>
</html>
